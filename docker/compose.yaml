# basmat 运行环境 —— Docker Compose 定义
# ======================================
#
# 构建（首次或改了 Dockerfile 后）：
#   docker compose -f docker/compose.yaml build
#
# 交互式跑一条（参数原样传给 basmat）：
#   docker compose -f docker/compose.yaml run --rm basmat -d "(0)(1)(2)[3]"
#   docker compose -f docker/compose.yaml run --rm basmat -v 3.3 -o 2 -s 100000 "(0,0)(1,1)[3]"
#
# 批处理（一次容器启动跑多条；见 docker/basmat-batch）：
#   docker compose -f docker/compose.yaml run --rm -T basmat-batch < queries.txt
#
# 构建范围只有 docker/ 这一个目录（上下文极小），所以根目录**不需要** .dockerignore。
# 配方不含 basmat 源码/二进制 —— 构建时才按固定 commit 从上游拉取（GPL-3.0）。
# 详见 docker/README.md。
name: minbms-basmat

# 两个服务（单条 / 批处理）共用同一份构建与运行参数，用 YAML 锚点复用。
x-basmat: &basmat
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # 三个参数都可在命令行覆盖，例如：
      #   BASMAT_TAG=v4.0 docker compose ... build --build-arg BASMAT_SHA=...
      BASMAT_REPO: ${BASMAT_REPO:-https://github.com/kyodaisuu/basmat.git}
      BASMAT_TAG: ${BASMAT_TAG:-v4.0}
      BASMAT_SHA: ${BASMAT_SHA:-f2f0125b6618a1a298f53b63464ebdcec137ff92}
  image: minbms/basmat:4.0-f2f0125
  # 钉死平台：即使将来有人在 Apple Silicon / ARM 上跑，也是同一份 x86_64 镜像，结果可复现。
  platform: linux/amd64
  # 批处理要读 stdin（-i）；单条调用留着它也无害。
  stdin_open: true
  # 让容器内的 PID 1 得到正确处理（basmat 本身很快，这条是为批处理准备的）。
  init: true

services:
  # 单条调用：`... run --rm basmat [选项...] ini`
  basmat: *basmat

  # 批处理：入口换成 basmat-batch，从 stdin 读多条 ini（一次容器启动跑完整批）。
  basmat-batch:
    <<: *basmat
    entrypoint: ["basmat-batch"]
